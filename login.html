<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Smart Study Planner</title>

    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #dbeafe, #eef2ff, #f8fafc);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            background: rgba(255, 255, 255, 0.95);
            width: 90%;
            max-width: 470px;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.12);
            backdrop-filter: blur(8px);
        }

        .logo {
            text-align: center;
            font-size: 42px;
            margin-bottom: 8px;
        }

        h2 {
            text-align: center;
            margin: 0;
            color: #1e293b;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            font-size: 14px;
            margin-bottom: 25px;
        }

        label {
            font-size: 14px;
            font-weight: 600;
            color: #334155;
            display: block;
            margin-top: 12px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            margin-bottom: 15px;
            border-radius: 12px;
            border: 1px solid #cbd5e1;
            box-sizing: border-box;
            font-size: 14px;
            transition: 0.3s;
        }

        input:focus {
            border-color: #6366f1;
            outline: none;
            box-shadow: 0 0 8px rgba(99,102,241,0.25);
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 12px;
            background: linear-gradient(90deg, #6366f1, #8b5cf6);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            opacity: 0.92;
        }

        .error-box {
            background: #fee2e2;
            color: #b91c1c;
            padding: 8px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 10px;
            text-align: center;
        }

        .footer {
            text-align: center;
            margin-top: 18px;
            font-size: 14px;
            color: #475569;
        }

        .footer a {
            color: #6366f1;
            text-decoration: none;
            font-weight: 600;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        .quote {
            text-align: center;
            margin-top: 18px;
            font-size: 12px;
            color: #94a3b8;
            font-style: italic;
        }
    </style>
</head>

<body>

<div class="login-container">

    <div class="logo">🎓</div>
    <h2>Welcome Back</h2>
    <p class="subtitle">Login to continue your study journey</p>

    <form method="POST">
        {% csrf_token %}

        {% if form.errors %}
            <div class="error-box">Invalid username or password</div>
        {% endif %}

        <label>👤 Username</label>
        {{ form.username }}

        <label>🔒 Password</label>
        {{ form.password }}

        <button type="submit">Login</button>
    </form>

    <div class="footer">
        Don't have an account?
        <a href="{% url 'register' %}">Register</a>
    </div>

    <div class="quote">
        “Every great achievement begins with a plan.”
    </div>

</div>

</body>
</html>
